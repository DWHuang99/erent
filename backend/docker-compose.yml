name: ai-gateway-go-auth

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-ai_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_gateway_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 96m
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-ai_gateway}:${POSTGRES_PASSWORD:-ai_gateway_dev}@postgres:5432/${POSTGRES_DB:-ai_gateway}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
      args:
        BUILD_VERSION: local
    image: ai-gateway-go-api:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_gateway}:${POSTGRES_PASSWORD:-ai_gateway_dev}@postgres:5432/${POSTGRES_DB:-ai_gateway}?sslmode=disable
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10s}
      OIDC_DISCOVERY_TIMEOUT: ${OIDC_DISCOVERY_TIMEOUT:-10s}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      OAI_ISSUER: ${OAI_ISSUER:-}
      OAI_CLIENT_ID: ${OAI_CLIENT_ID:-}
      OAI_CLIENT_SECRET: ${OAI_CLIENT_SECRET:-}
      OAI_REDIRECT_URL: ${OAI_REDIRECT_URL:-}
      LOG_FILE: ${LOG_FILE:-/var/log/ai-gateway/app.log}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the root .env}
      JWT_ISSUER: ${JWT_ISSUER:-ai-gateway}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-gateway-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin12345}
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-admin}
    expose:
      - "8080"
    volumes:
      - api-logs:/var/log/ai-gateway
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    mem_limit: 256m
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
      args:
        BUILD_VERSION: local
    image: ai-gateway-go-gateway:local
    environment:
      GATEWAY_ADDR: ":8080"
      GATEWAY_UPSTREAM_URL: http://api:8080
      GATEWAY_DIAL_TIMEOUT: ${GATEWAY_DIAL_TIMEOUT:-2s}
      GATEWAY_RESPONSE_HEADER_TIMEOUT: ${GATEWAY_RESPONSE_HEADER_TIMEOUT:-30s}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    mem_limit: 128m
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      args:
        NODE_VERSION: "22"
    image: ai-gateway-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

volumes:
  api-logs:
  postgres-data:
  redis-data:
