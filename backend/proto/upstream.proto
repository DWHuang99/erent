syntax = "proto3";

package upstream;
option go_package = "erent/internal/rpc/upstream";

import "google/protobuf/timestamp.proto";

service UpstreamService {
   rpc GetDeviceFlowCode(DeviceFlowRequest) returns (DeviceFlowResponse);
   // Waits for approval, not final OAuth tokens. Bounded to 15 minutes and caller cancellation.
   rpc PollDeviceFlow(PollDeviceFlowRequest) returns (DeviceAuthorizationResponse);
   rpc ExchangeCode(ExchangeCodeRequest) returns (TokenResponse);
   // Refreshes provider credentials; callers coordinate refresh and persist the result.
   rpc RefreshToken(RefreshTokenRequest) returns (TokenResponse);
   // Returns discovery metadata for a configured issuer; reject unknown issuers.
   rpc GetProvider(ProviderRequest) returns (ProviderResponse);
   // Returns verified claims; verification failures use a non-OK gRPC status.
   rpc Verifier(VerifyRequest) returns (VerifyResponse);
}

message ExchangeCodeRequest{
    string code = 1;
    // PKCE 校验用，对应 oauth2.VerifierOption(flow.Verifier)
    string code_verifier = 2;
    string provider = 3;
    // Empty preserves the existing browser flow. Set by the API, not browser input.
    string flow_type = 4;
}

message RefreshTokenRequest{
    string refresh_token = 1;
    string provider = 2;
}

message TokenResponse{
    string access_token = 1;
    string refresh_token = 2;
    string token_type = 3;
    google.protobuf.Timestamp expires_at = 4;
    string id_token = 5;
}

message ProviderRequest{
    // Must match a configured issuer, not an arbitrary URL to fetch.
    string issuer = 1;
}

message DeviceFlowRequest {
    string provider = 1;
}

message DeviceFlowResponse {
    string device_auth_id = 1;
    string user_code = 2;
    uint32 interval_seconds = 3;
    string verification_url = 4;
}

message PollDeviceFlowRequest {
    string provider = 1;
    string device_auth_id = 2;
    string user_code = 3;
    // Positive interval returned by GetDeviceFlowCode; maximum 900 seconds.
    uint32 interval_seconds = 4;
}

// Internal credentials: must not be returned to the browser.
message DeviceAuthorizationResponse {
    string authorization_code = 1;
    string code_verifier = 2;
}

message ProviderResponse{
    string issuer = 1;
    string authURL = 2;
    string tokenURL = 3;
    string deviceAuthURL = 4;
    string userInfoURL = 5;
    string jwksURL = 6;
    repeated string algorithms = 7;
    bytes rawClaims = 8;
}

message VerifyRequest{
    string rawidtoken = 1;
    // Configured provider key, e.g. "oai"; selects issuer and client ID checks.
    string provider = 2;
}

// Returned only after signature, issuer, audience and expiry validation.
// The API must still compare nonce with its stored login flow before saving.
message VerifyResponse{
    string issuer = 1;
    string subject = 2;
    repeated string audience = 3;
    google.protobuf.Timestamp expires_at = 4;
    google.protobuf.Timestamp issued_at = 5;
    string nonce = 6;
    // Verified JSON claims, including provider-specific account and email fields.
    bytes claims_json = 7;
}
