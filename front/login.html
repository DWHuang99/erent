<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI Gateway</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="logo-dot"></span>
                <span>AI Gateway</span>
            </div>
            <h2>欢迎回来</h2>
            <p class="login-subtitle">登录以管理你的 API Key 与调用配置</p>
            <form>
                <div class="form-field">
                    <label for="username">用户名 / 邮箱</label>
                    <input id="username" type="text" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="form-field">
                    <label for="password">密码</label>
                    <input id="password" type="password" placeholder="请输入密码" required>
                </div>
                <div class="form-row-between">
                    <label>
                        <input type="checkbox" style="width:auto;">
                        记住我
                    </label>
                    <a href="#">忘记密码？</a>
                </div>
                <button type="submit" class="btn-primary">登录</button>
            </form>
            <p class="login-footer">还没有账号？<a href="#">立即注册</a></p>
        </div>
    </div>
</body>
</html>
