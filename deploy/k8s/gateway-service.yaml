apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: ai-gateway

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: ai-gateway
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: ai-gateway
data:
  SERVER_PORT: "8080"

  # Kubernetes Service DNS replaces Nacos discovery in this deployment mode.
  NACOS_CONFIG_ENABLED: "false"
  NACOS_DISCOVERY_ENABLED: "false"
  CORE_SERVICE_BASE_URL: "http://core-service:8081"
  CORE_SERVICE_WEBSOCKET_URL: "ws://core-service:8081"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: ai-gateway
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        app.kubernetes.io/part-of: ai-gateway
    spec:
      containers:
        - name: gateway-service
          image: ai-gateway-gateway-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: ai-gateway
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: http
