name: CI

on:
  push:
    branches: [rewrite/go-v2, develop, main]

  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Go verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        shell: bash
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Run static analysis
        working-directory: backend
        run: go vet ./...

      - name: Run tests with race detector
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build binaries
        working-directory: backend
        run: go build ./cmd/...

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build production assets
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [api, gateway, upstream, migrations]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: ${{ matrix.target }}
          push: false
          tags: ai-gateway-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  web-image:
    name: Docker image (web)
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: ai-gateway-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
